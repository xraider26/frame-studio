<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Starting Orchestra</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0c1017; color: #e8edf5; font: 16px/1.6 'Segoe UI', sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; }
    main { width: min(440px, 80vw); }
    .brand { color: #ff9b4a; text-transform: uppercase; letter-spacing: .22em; font-size: 12px; }
    h1 { font-size: 36px; line-height: 1.15; margin: 20px 0 16px; font-weight: 600; letter-spacing: -.03em; }
    p { color: #a9b6c9; margin: 0; }
    .progress { width: 100%; height: 3px; background: #26313f; margin-top: 36px; overflow: hidden; }
    .progress::after { display: block; content: ''; height: 100%; width: 35%; background: #ff9b4a; animation: move 1.5s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(-100%); } to { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
  </style>
</head>
<body><main><div class="brand">Orchestra</div><h1>Your studio is<br>getting ready.</h1><p>Starting your local video workspace.<br>This can take a moment on the first launch.</p><div class="progress" role="progressbar" aria-label="Starting Orchestra"></div></main></body>
</html>
